# Déploiement « 1 clic » sur Render (https://render.com)
# 1) Render → New → Blueprint → sélectionnez ce dépôt
# 2) Render lit ce fichier, construit l'image Docker et déploie.
#
# Plan FREE : pas de disque persistant → la base SQLite est réinitialisée à
# chaque redémarrage/redéploiement (parfait pour une démo). Pour conserver les
# données, passez le plan à "starter" et décommentez le bloc "disk" ci-dessous.
services:
  - type: web
    name: gestion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION_SECRET
        generateValue: true # secret de session généré automatiquement
      - key: DB_PATH
        value: /app/data/gestion.db
      # - key: ANTHROPIC_API_KEY   # (optionnel) active la lecture IA des photos/imports
      #   sync: false
    # Données persistantes (plan payant "starter" requis) :
    # plan: starter
    # disk:
    #   name: gestion-data
    #   mountPath: /app/data
    #   sizeGB: 1
