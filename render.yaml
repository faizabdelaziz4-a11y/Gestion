# Déploiement « 1 clic » sur Render (https://render.com)
# 1) Poussez ce dépôt sur GitHub
# 2) Render → New → Blueprint → sélectionnez ce dépôt
# 3) Render lit ce fichier, construit l'image Docker et déploie.
services:
  - type: web
    name: gestion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SESSION_SECRET
        generateValue: true # secret de session généré automatiquement
      - key: DB_PATH
        value: /app/data/gestion.db
      # - key: ANTHROPIC_API_KEY   # (optionnel) active la lecture IA des photos/imports
      #   sync: false
    disk:
      name: gestion-data
      mountPath: /app/data # base SQLite persistante
      sizeGB: 1
